<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quên mật khẩu · Tạp hóa 360</title>
<link rel="stylesheet" href="/static/retail.css?v=3.1">
<link rel="stylesheet" href="/static/password-recovery.css?v=2">
<script src="/static/password-recovery.js?v=2" defer></script>
</head>
<body class="login-page">
<main class="login-card">
<div class="brand-mark">360</div><p class="eyebrow">TẠP HÓA 360</p>
<ol class="recovery-steps" aria-label="Các bước khôi phục mật khẩu">
<li aria-current="step">1. Email</li><li>2. Xác thực OTP</li><li>3. Mật khẩu mới</li>
</ol>
<h1 id="recovery-title">Quên mật khẩu?</h1>
<p id="recovery-description" class="muted">Nhập email khôi phục đã liên kết với tài khoản cửa hàng để nhận mã OTP gồm 6 chữ số.</p>
<form id="recovery-email-form">
<label>Email khôi phục<input name="email" type="email" required autocomplete="email" maxlength="254" autofocus></label>
<p class="hint">Dùng email của tài khoản cửa hàng.</p>
<button type="submit" class="primary wide">Gửi mã OTP</button>
</form>
<form id="recovery-otp-form" hidden>
<label>Mã OTP 6 chữ số<input name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" required minlength="6" maxlength="6" pattern="[0-9]{6}" aria-describedby="otp-time-left" class="recovery-otp-input"></label>
<p id="otp-time-left" class="hint" aria-live="off"></p>
<button type="submit" class="primary wide">Xác thực OTP</button>
<button id="resend-otp" type="button" class="wide">Gửi lại mã OTP</button>
<button id="change-recovery-email" type="button" class="wide">Đổi email khôi phục</button>
</form>
<form id="recovery-password-form" hidden>
<label>Mật khẩu mới<input name="password" type="password" required autocomplete="new-password" minlength="10" maxlength="200"></label>
<label>Nhập lại mật khẩu mới<input name="confirm_password" type="password" required autocomplete="new-password" minlength="10" maxlength="200"></label>
<button type="submit" class="primary wide">Lưu mật khẩu mới</button>
<button id="restart-recovery" type="button" class="wide">Lấy mã OTP mới</button>
</form>
<p id="recovery-error" class="error" role="alert"></p>
<p id="recovery-status" class="notice" role="status" hidden></p>
<a href="/login" class="login-back">← Về trang đăng nhập</a>
<p class="login-foot">Bán hàng gọn gàng. Quản lý rõ ràng.</p>
</main>
</body></html>
